<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lommeregner - simpel</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Simpel Lommeregner</h1>
      <input type="text" id="number-1" />

      <select id="drop-down">
        <option value="plus">+</option>
        <option value="minus">-</option>
        <option value="gange">*</option>
        <option value="dividere">/</option>
      </select>

      <input type="text" id="number-2" />
      <button type="button" id="beregn">Beregn</button>

      <input type="text" id="resultat" readonly />
    </main>
  </body>
